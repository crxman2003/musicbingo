<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Bingo Jumbotron - Full Text View</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background: #141916; 
            color: #f4f6f0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .fs-button {
            position: absolute;
            top: 20px;
            right: 10vw;
            background: #2d5a27;
            border: 2px solid #3d7a35;
            color: #fdfefb;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            z-index: 9999;
        }
        .fs-button:hover {
            background: #3d7a35;
            transform: scale(1.03);
        }

        #board {
            width: 80vw;
            height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        /* 🌲 ROW 1: THE TOP SLOT WIDESCREEN HIGHLIGHT CARD */
        .featured-song {
            background: #1b261f; 
            border: 6px solid #2d5a27; 
            border-radius: 24px;
            padding: 30px;
            display: flex;
            align-items: center;
            box-shadow: 0 15px 45px rgba(45, 90, 39, 0.25);
            height: 42vh; 
            width: 100%;
        }
        .featured-song img {
            height: 100%; 
            aspect-ratio: 1 / 1; 
            border-radius: 16px;
            margin-right: 40px;
            background: #111;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            flex-shrink: 0;
            border: 3px solid #3d7a35;
        }
        .featured-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        .featured-label {
            color: #5da953; 
            font-size: 1.5vw; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .featured-label::before { content: "🌲"; } 
        
        /* ✅ FIXED: Main title now cleanly wraps up to 3 lines if needed */
        .featured-title {
            font-size: 3.2vw; /* Slightly smaller base font size to accommodate wrap */
            font-weight: 900;
            line-height: 1.2;
            color: #fdfefb; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        h2 { 
            color: #8c968e; 
            font-size: 1.4vw;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 4px solid #232d26; 
            padding-bottom: 8px; 
            margin: 15px 0;
            width: 100%;
        }

        /* 🪵 ROW 2: THE 4-COLUMN SYNCED HORIZONTAL FOOTPRINT */
        .history-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px;
            height: 33vh; 
            width: 100%;
        }
        
        .song-card { 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: flex-start; /* Aligns content from the top down */
            background: #221c16; 
            padding: 15px; 
            border-radius: 20px; 
            border: 3px solid #362d24; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            text-align: center;
            overflow: hidden;
            height: 100%;
        }
        .song-card img { 
            height: 50%; /* Reduced image footprint slightly to give text block more space */
            aspect-ratio: 1 / 1;
            border-radius: 10px; 
            margin-bottom: 10px; 
            background: #111; 
            flex-shrink: 0;
            border: 2px solid #4a3e31;
        }
        
        /* ✅ FIXED: Small history cards now dynamically wrap text and scale small enough to fit */
        .song-title { 
            font-size: 1.1vw; /* Brought text size down slightly for distance panel scaling */
            font-weight: 700; 
            color: #e6dfd5; 
            width: 100%;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Safety valve: caps extremely long track strings at 3 clean rows */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .badge { 
            background: #362d24; 
            color: #d4a373; 
            padding: 4px 12px; 
            border-radius: 6px; 
            font-size: 0.8vw; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <button class="fs-button" onclick="toggleFullscreen()">🖥️ Fullscreen Mode</button>

    <div id="board">Loading widescreen horizontal panels...</div>

    <script>
        const dbUrl = "https://musicbingo-2564a-default-rtdb.firebaseio.com/history.json";

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .catch(err => alert(`Error entering fullscreen: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        function fetchUpdates() {
            fetch(dbUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) return;
                    
                    let htmlOutput = "";
                    
                    const standardSong = data[0];
                    if (standardSong && standardSong.title) {
                        htmlOutput += `
                            <div class="featured-song">
                                <img src="${standardSong.image || 'https://placehold.co🌲'}" alt="Cover">
                                <div class="featured-details">
                                    <span class="featured-label">Last Song Played</span>
                                    <div class="featured-title">${standardSong.title}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    htmlOutput += `<h2>Previously Played Tracks</h2>`;
                    htmlOutput += `<div class="history-list">`;
                    for (let i = 1; i < data.length; i++) {
                        const song = data[i];
                        if (!song || !song.title) continue;
                        htmlOutput += `
                            <div class="song-card">
                                <span class="badge">Track ${i + 1}</span>
                                <img src="${song.image || 'https://placehold.co🪵'}" alt="Cover">
                                <div class="song-title">${song.title}</div>
                            </div>
                        `;
                    }
                    htmlOutput += `</div>`;
                    
                    document.getElementById("board").innerHTML = htmlOutput;
                })
                .catch(err => console.error("Database tracking breakdown:", err));
        }

        setInterval(fetchUpdates, 3000);
        fetchUpdates();
    </script>
</body>
</html>
