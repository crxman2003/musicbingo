<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Bingo Jumbotron - Max Visibility</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background: #141916; 
            color: #f4f6f0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 40px 0;
            width: 100%;
            min-height: 100vh;
            position: relative;
        }
        
        /* 🖥️ OVERSIZED FULLSCREEN CONTROL BUTTON */
        .fs-button {
            position: absolute;
            top: 25px;
            right: 10vw; /* Keeps the button aligned with our 80% grid boundary */
            background: #2d5a27;
            border: 2px solid #3d7a35;
            color: #fdfefb;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 1.25em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            z-index: 9999;
        }
        .fs-button:hover {
            background: #3d7a35;
            transform: scale(1.03);
        }

        /* 📐 STRETCHES ENTIRE INTERFACE TO TAKE UP 80% OF THE DISPLAY */
        #board {
            width: 80vw;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding-top: 60px; 
        }

        /* 🌲 GIGANTIC FEATURED CARD */
        .featured-song {
            background: #1b261f; 
            border: 8px solid #2d5a27; /* Thicker frame footprint */
            border-radius: 32px;
            padding: 50px;
            display: flex;
            align-items: center;
            box-shadow: 0 20px 60px rgba(45, 90, 39, 0.35);
            width: 100%;
        }
        .featured-song img {
            width: 18vw; /* Scales directly with the width of the display screen */
            height: 18vw;
            min-width: 250px;
            min-height: 250px;
            border-radius: 20px;
            margin-right: 50px;
            background: #111;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            flex-shrink: 0;
            border: 3px solid #3d7a35;
        }
        .featured-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }
        .featured-label {
            color: #5da953; 
            font-size: 2.2vw; /* Dynamically scales text sizes based on TV size */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .featured-label::before { content: "🌲"; } 
        .featured-title {
            font-size: 4.8vw; /* Explodes song titles out to fit the wider card layout */
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            color: #fdfefb; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* 🪓 EXPANDED BACKLOG LABELS */
        h2 { 
            color: #8c968e; 
            font-size: 2.2em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-bottom: 5px solid #232d26; 
            padding-bottom: 20px; 
            margin-top: 30px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }
        
        /* 🪵 ENLARGED TIMBER HISTORY SECTIONS */
        .song-row { 
            display: flex; 
            align-items: center; 
            background: #221c16; 
            padding: 35px 50px; /* Enhanced internal sizing margins */
            border-radius: 24px; 
            width: 100%;
            border: 3px solid #362d24; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .song-row img { 
            width: 7vw;
            height: 7vw; 
            min-width: 90px;
            min-height: 90px;
            border-radius: 12px; 
            margin-right: 40px; 
            background: #111; 
            flex-shrink: 0;
            border: 2px solid #4a3e31;
        }
        .song-title { 
            font-size: 2.8vw; /* Considerably bigger font weight for older rows */
            font-weight: 700; 
            color: #e6dfd5; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge { 
            background: #362d24; 
            color: #d4a373; 
            padding: 12px 24px; 
            border-radius: 12px; 
            margin-right: 40px; 
            font-size: 1.4vw; 
            font-weight: 800;
            text-transform: uppercase;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <button class="fs-button" onclick="toggleFullscreen()">🖥️ Fullscreen Mode</button>

    <div id="board">I hear music in the distance...</div>

    <script>
        const dbUrl = "https://musicbingo-2564a-default-rtdb.firebaseio.com/history.json";

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .catch(err => alert(`Error entering fullscreen: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        function fetchUpdates() {
            fetch(dbUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) return;
                    let htmlOutput = "";
                    
                    const standardSong = data[0];
                    if (standardSong && standardSong.title) {
                        htmlOutput += `
                            <div class="featured-song">
                                <img src="${standardSong.image || 'https://placehold.co🌲'}" alt="Cover">
                                <div class="featured-details">
                                    <span class="featured-label">Last Song Played</span>
                                    <div class="featured-title">${standardSong.title}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    htmlOutput += `<h2>Trail Backlog (Previous Songs)</h2>`;
                    htmlOutput += `<div class="history-list">`;
                    
                    for (let i = 1; i < data.length; i++) {
                        const song = data[i];
                        if (!song || !song.title) continue;
                        htmlOutput += `
                            <div class="song-row">
                                <span class="badge">Track ${i + 1}</span>
                                <img src="${song.image || 'https://placehold.co🪵'}" alt="Cover">
                                <div class="song-title">${song.title}</div>
                            </div>
                        `;
                    }
                    
                    htmlOutput += `</div>`;
                    document.getElementById("board").innerHTML = htmlOutput;
                })
                .catch(err => console.error("Database connection fault:", err));
        }

        setInterval(fetchUpdates, 3000);
        fetchUpdates();
    </script>
</body>
</html>
