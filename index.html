<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Bingo Jumbotron - No Scroll TV Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background: #141916; 
            color: #f4f6f0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Physically blocks any vertical or horizontal scrolling */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 🖥️ OVERSIZED FULLSCREEN CONTROL BUTTON */
        .fs-button {
            position: absolute;
            top: 20px;
            right: 10vw;
            background: #2d5a27;
            border: 2px solid #3d7a35;
            color: #fdfefb;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            z-index: 9999;
        }
        .fs-button:hover {
            background: #3d7a35;
            transform: scale(1.03);
        }

        /* 📐 HOLDS CARDS AT EXACTLY 80% WIDTH AND 85% HEIGHT */
        #board {
            width: 80vw;
            height: 82vh;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr; /* Left side is slightly wider than the right */
            gap: 40px;
            margin-top: 30px;
        }

        /* 🌲 LEFT SIDE: GIGANTIC MAIN HIGHLIGHT CARD */
        .featured-column {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .featured-song {
            background: #1b261f; 
            border: 8px solid #2d5a27; 
            border-radius: 32px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 20px 60px rgba(45, 90, 39, 0.35);
            flex-grow: 1; /* Fills all available vertical space */
            height: 100%;
        }
        .featured-song img {
            width: 22vw; /* Perfectly scaled square based on viewport width */
            height: 22vw;
            max-height: 45vh; /* Prevents picture scaling from expanding beyond bounds */
            border-radius: 24px;
            margin-bottom: 30px;
            background: #111;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            flex-shrink: 0;
            border: 4px solid #3d7a35;
        }
        .featured-details {
            width: 100%;
        }
        .featured-label {
            color: #5da953; 
            font-size: 1.8vw; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .featured-label::before { content: "🌲"; } 
        .featured-title {
            font-size: 3.5vw; 
            font-weight: 900;
            line-height: 1.1;
            color: #fdfefb; 
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Safely wraps long song names into 3 crisp rows maximum */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 🪓 RIGHT SIDE: COMPACT ROLLING BACKLOG STACK */
        .history-column {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        h2 { 
            color: #8c968e; 
            font-size: 1.6vw;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 4px solid #232d26; 
            padding-bottom: 10px; 
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Spreads the 4 cards evenly from top to bottom */
            height: 100%;
            gap: 15px;
        }
        
        /* 🪵 SLIMMED TIMBER HISTORY BLOCKS */
        .song-row { 
            display: flex; 
            align-items: center; 
            background: #221c16; 
            padding: 15px 25px; 
            border-radius: 20px; 
            width: 100%;
            border: 3px solid #362d24; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            flex-grow: 1; /* Forces rows to stretch equally to fill the height */
            max-height: 22%; /* Keeps elements perfectly sized */
        }
        .song-row img { 
            height: 80%; /* Sizes dynamically with the row frame height */
            aspect-ratio: 1 / 1; /* Maintains square formatting rules */
            border-radius: 10px; 
            margin-right: 25px; 
            background: #111; 
            flex-shrink: 0;
            border: 2px solid #4a3e31;
        }
        .song-title { 
            font-size: 1.8vw; 
            font-weight: 700; 
            color: #e6dfd5; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge { 
            background: #362d24; 
            color: #d4a373; 
            padding: 8px 16px; 
            border-radius: 8px; 
            margin-right: 25px; 
            font-size: 1vw; 
            font-weight: 800;
            text-transform: uppercase;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <button class="fs-button" onclick="toggleFullscreen()">🖥️ Fullscreen Mode</button>

    <div id="board">Loading widescreen split layout...</div>

    <script>
        const dbUrl = "https://firebaseio.com";

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .catch(err => alert(`Error entering fullscreen: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        function fetchUpdates() {
            fetch(dbUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) return;
                    
                    let htmlOutput = "";
                    
                    // 1. LEFT PANEL CONSTRUCTION (Featured Track)
                    const standardSong = data[0];
                    htmlOutput += `<div class="featured-column">`;
                    if (standardSong && standardSong.title) {
                        htmlOutput += `
                            <div class="featured-song">
                                <img src="${standardSong.image || 'https://placehold.co🌲'}" alt="Cover">
                                <div class="featured-details">
                                    <span class="featured-label">Last Song Played</span>
                                    <div class="featured-title">${standardSong.title}</div>
                                </div>
                            </div>
                        `;
                    }
                    htmlOutput += `</div>`;
                    
                    // 2. RIGHT PANEL CONSTRUCTION (History Stack)
                    htmlOutput += `<div class="history-column">`;
                    htmlOutput += `<h2>Trail Backlog</h2>`;
                    htmlOutput += `<div class="history-list">`;
                    
                    for (let i = 1; i < data.length; i++) {
                        const song = data[i];
                        if (!song || !song.title) continue;
                        htmlOutput += `
                            <div class="song-row">
                                <span class="badge">Track ${i + 1}</span>
                                <img src="${song.image || 'https://placehold.co🪵'}" alt="Cover">
                                <div class="song-title">${song.title}</div>
                            </div>
                        `;
                    }
                    
                    htmlOutput += `</div></div>`; // Close column tags
                    document.getElementById("board").innerHTML = htmlOutput;
                })
                .catch(err => console.error("Database alignment link tracking breakdown:", err));
        }

        setInterval(fetchUpdates, 3000);
        fetchUpdates();
    </script>
</body>
</html>
