<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Bingo Jumbotron - Woodsy Theme</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            background: #141916; 
            color: #f4f6f0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 30px;
            width: 100%;
            min-height: 100vh;
            position: relative;
        }
        
        /* 🖥️ FULLSCREEN CONTROL BUTTON STYLING */
        .fs-button {
            position: absolute;
            top: 25px;
            right: 30px;
            background: #2d5a27;
            border: 2px solid #3d7a35;
            color: #fdfefb;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            z-index: 9999;
        }
        .fs-button:hover {
            background: #3d7a35;
            transform: scale(1.03);
        }

        #board {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 35px;
            padding-top: 40px; /* Leave clean headroom for the button */
        }

        /* 🌲 MAJESTIC EVERGREEN FEATURED CARD */
        .featured-song {
            background: #1b261f; 
            border: 6px solid #2d5a27; 
            border-radius: 24px;
            padding: 40px;
            display: flex;
            align-items: center;
            box-shadow: 0 12px 45px rgba(45, 90, 39, 0.25);
            width: 100%;
        }
        .featured-song img {
            width: 240px;
            height: 240px;
            border-radius: 16px;
            margin-right: 40px;
            background: #111;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            flex-shrink: 0;
            border: 2px solid #3d7a35;
        }
        .featured-details {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .featured-label {
            color: #5da953; 
            font-size: 1.6em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .featured-label::before { content: "🌲"; } 
        .featured-title {
            font-size: 3.8em;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.5px;
            color: #fdfefb; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.4);
        }

        /* 🪓 HISTORY STACK LOGS */
        h2 { 
            color: #8c968e; 
            font-size: 2em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border-bottom: 4px solid #232d26; 
            padding-bottom: 15px; 
            margin-top: 20px;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }
        .song-row { 
            display: flex; 
            align-items: center; 
            background: #221c16; 
            padding: 25px 35px; 
            border-radius: 16px; 
            width: 100%;
            border: 2px solid #362d24; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .song-row img { 
            width: 100px; 
            height: 100px; 
            border-radius: 10px; 
            margin-right: 30px; 
            background: #111; 
            flex-shrink: 0;
            border: 1px solid #4a3e31;
        }
        .song-title { 
            font-size: 2.2em; 
            font-weight: 700; 
            color: #e6dfd5; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge { 
            background: #362d24; 
            color: #d4a373; 
            padding: 10px 20px; 
            border-radius: 8px; 
            margin-right: 30px; 
            font-size: 1.2em; 
            font-weight: 800;
            text-transform: uppercase;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Clickable Fullscreen Action Widget Trigger -->
    <button class="fs-button" onclick="toggleFullscreen()">🖥️ Fullscreen Mode</button>

    <div id="board">I hear music in the distance...</div>

    <script>
        const dbUrl = "https://musicbingo-2564a-default-rtdb.firebaseio.com/";

        // ⚙️ THE JAVASCRIPT LOGIC TO COMMAND NATIVE FULLSCREEN OPERATION
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .catch(err => alert(`Error entering fullscreen: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        function fetchUpdates() {
            fetch(dbUrl)
                .then(res => res.json())
                .then(data => {
                    if (!data || data.length === 0) return;
                    let htmlOutput = "";
                    
                    const standardSong = data[0];
                    if (standardSong && standardSong.title) {
                        htmlOutput += `
                            <div class="featured-song">
                                <img src="${standardSong.image || 'https://placehold.co🌲'}" alt="Cover">
                                <div class="featured-details">
                                    <span class="featured-label">Last Song Played</span>
                                    <div class="featured-title">${standardSong.title}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    htmlOutput += `<h2>Trail Backlog (Previous Songs)</h2>`;
                    htmlOutput += `<div class="history-list">`;
                    
                    for (let i = 1; i < data.length; i++) {
                        const song = data[i];
                        if (!song || !song.title) continue;
                        htmlOutput += `
                            <div class="song-row">
                                <span class="badge">Track ${i + 1}</span>
                                <img src="${song.image || 'https://placehold.co🪵'}" alt="Cover">
                                <div class="song-title">${song.title}</div>
                            </div>
                        `;
                    }
                    
                    htmlOutput += `</div>`;
                    document.getElementById("board").innerHTML = htmlOutput;
                })
                .catch(err => console.error("Database tracking loop link error:", err));
        }

        setInterval(fetchUpdates, 3000);
        fetchUpdates();
    </script>
</body>
</html>
